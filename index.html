<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Selección</title>
    <style>
        :root{
            --gap: 1rem;
            --max-width: 1100px;
        }
        body{
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            background: #f7f7f7;
            color: #222;
        }
        .wrap{
            width: 100%;
            max-width: var(--max-width);
        }
        h1{
            text-align: center;
            margin: 0 0 1.5rem;
            font-size: 1.25rem;
        }
        /* Three responsive columns */
        .cols{
            display: flex;
            gap: var(--gap);
            flex-wrap: wrap;
        }
        .col{
            flex: 1 1 calc(33.333% - var(--gap));
            box-sizing: border-box;
            min-width: 200px;
            background: #fff;
            border-radius: 8px;
            padding: 0.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .col a{
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .col img{
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            object-fit: cover;
        }
        .col:hover{
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .caption{
            margin-top: .5rem;
            font-size: .95rem;
        }
        /* For very small screens show stacked columns */
        @media (max-width: 640px){
            .col{ flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Elige una opción</h1>
        <main class="cols" role="main">
            <!-- Columna 1 -->
            <div class="col">
                <a href="arcam.html?modelo=models\capibara.glb" title="Ir a página 1">
                    <img src="img\capibara.png" alt="Imagen 1 - descripción">
                    <div class="caption">Opción 1</div>
                </a>
            </div>

            <!-- Columna 2 -->
            <div class="col">
                <a href="arcam.html?modelo=models\yaguarete.glb" title="Ir a página 2">
                    <img src="img\yaguarete.png" alt="Imagen 2 - descripción">
                    <div class="caption">Opción 2</div>
                </a>
            </div>

            <!-- Columna 3 -->
            <div class="col">
                <a href="arcam.html?modelo=models\yacare.glb" title="Ir a página 3">
                    <img src="img\yacare.png" alt="Imagen 3 - descripción">
                    <div class="caption">Opción 3</div>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
